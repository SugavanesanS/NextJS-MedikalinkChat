<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" crossorigin="use-credentials" />
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>React App</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.3.122/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.3.122/pdf.worker.min.js"></script>
  <!-- Add Moment.js and Locale Script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment-with-locales.min.js"></script>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/react-toastify@10.0.6/dist/ReactToastify.css" />


</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="app-loader" class="loading" style="display: none; position: fixed; z-index: 10000; inset: 0%;">
    <img src="http://172.21.4.100/medicallink/resources/images/load.gif" alt="loader" width="32" height="32">
  </div>
  <span id="total_unread_counter" style="display:block">1</span>
  <div id="react-chat-mod-root"></div>
  <div id="message_container"></div>
  <div class="col-md-6" id="recent_msg_block"></div>
  <div class="col-md-6" id="urgent_msg_block"></div>
  <div class="col-md-6" id="pinned_msg_block"></div>

</body>

</html>
